<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="luminaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#0f172a" rx="40"/>
  
  <!-- Glow effect circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#luminaGradient)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Styled L -->
  <g filter="url(#glow)">
    <!-- Vertical bar of L -->
    <rect x="55" y="40" width="20" height="110" fill="url(#luminaGradient)" rx="10"/>
    
    <!-- Horizontal bar of L -->
    <rect x="55" y="140" width="80" height="20" fill="url(#luminaGradient)" rx="10"/>
    
    <!-- Accent shine -->
    <ellipse cx="65" cy="50" rx="8" ry="15" fill="white" opacity="0.4"/>
  </g>
</svg>
